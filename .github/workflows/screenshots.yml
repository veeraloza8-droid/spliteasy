name: Refresh project screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture screenshots of the actual app
        run: |
          python3 -m http.server 8765 >/tmp/spliteasy-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:8765/', { waitUntil: 'load', timeout: 30000 });
            await page.locator('#ready-label').getByText('Ready to use').waitFor();
            fs.mkdirSync('screenshots', { recursive: true });
            await page.screenshot({ path: 'screenshots/welcome.png', fullPage: true });
            await page.locator('#new-name').fill('Friday Dinner');
            await page.locator('#new-friends').fill('Aarav, Meera');
            await page.locator('#create-btn').click();
            await page.locator('#group-title').getByText('Friday Dinner').waitFor();
            await page.locator('#expense-name').fill('Pizza');
            await page.locator('#expense-value').fill('900');
            await page.locator('#save-expense').click();
            await page.locator('#total-spent').getByText(/900/).waitFor();
            await page.screenshot({ path: 'screenshots/dashboard.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/welcome.png screenshots/dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "Add screenshots captured from running SplitEasy"
            git push
          fi
